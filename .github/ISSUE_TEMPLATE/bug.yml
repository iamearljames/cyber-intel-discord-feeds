name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove webhook URLs and API keys from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: "From `docker compose logs --since 1h`, around the problem."
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: "`docker compose run --rm intel-feeds --version`"
