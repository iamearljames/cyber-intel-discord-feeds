# Runs scripts/check_feeds.py from GitHub's network, which some feeds treat
# differently from a home connection. Manual trigger only; reads no secrets
# except the optional NVD API key.
name: Check feeds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      # Exact versions with hashes from the lock file, then the package itself
      # without resolving its dependencies again.
      - name: Install
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps .

      - name: Check every enabled source
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/check_feeds.py
