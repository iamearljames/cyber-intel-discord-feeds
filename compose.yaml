# docker compose up -d     start (builds the image the first time)
# docker compose logs -f   follow the log
# docker compose run --rm intel-feeds --test-post   one sample post per channel
services:
  intel-feeds:
    build: .
    image: intel-feeds:local
    restart: unless-stopped
    # Webhook URLs and API keys; copy .env.example to .env and fill it in.
    env_file: .env
    environment:
      INTEL_FEEDS_INTERVAL: 15m
    volumes:
      - data:/data
      # Edit sources.yaml here; the next run picks it up, no rebuild needed.
      - ./sources.yaml:/app/sources.yaml:ro
    # A run takes 10 to 20 s; give it time to finish when the container stops.
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
